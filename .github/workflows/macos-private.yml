name: Private native verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-native
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'GaryOAO/cli-companion-ci' && github.ref == 'refs/heads/main' && github.actor == 'GaryOAO' && github.triggering_actor == 'GaryOAO'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Isolated private verification (no plaintext output)
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: node scripts/run-private.mjs
      - name: Upload encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-${{ matrix.target }}
          path: ${{ runner.temp }}/sealed-diagnostics/diagnostics.enc
          if-no-files-found: error
          retention-days: 1
